services:
  api:
    build: .
    container_name: api_world_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - .:/app  
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        limits:
          cpus: '0.50'     
          memory: 256M    

  mongo:
    image: mongo:latest
    container_name: api_world_mongoDB
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M     

volumes:
  mongo_data: